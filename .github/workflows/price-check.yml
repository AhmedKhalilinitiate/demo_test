name: Scheduled Price Checks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,13,21 * * *'
permissions:
  contents: write
jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run price checker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
        run: python crawler/price_check.py
      - name: Commit updated price history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update scheduled price history
          file_pattern: data/price_history.json

name: Live price checks
on:
  push:
    branches: [ main ]
    paths:
      - 'crawler/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/price-check.yml'
  schedule:
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:
    inputs:
      tracker_id:
        description: "Optional tracker UUID for an instant first crawl"
        required: false
        type: string
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run V2 tests
        run: python -m pytest -q
      - name: Run live crawler
        run: python -m crawler.price_check
        env:
          TRACKER_ID: ${{ github.event.inputs.tracker_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
